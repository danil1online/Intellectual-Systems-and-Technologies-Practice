services:
  # --- GITLAB CE ---
  gitlab:
    build:
      context: ./gitlab-custom
      dockerfile: Dockerfile
    container_name: gitlab
    restart: always
    hostname: "gitlab.${HOST_DOMAIN:-localhost}"
    shm_size: "256m"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD}
      GITLAB_EXTERNAL_IP: ${GITLAB_HOST}
    ports:
      - "80:80"
      - "2222:22"
    volumes:
      - ./shared/data/gitlab-config:/etc/gitlab
      - ./shared/data/gitlab-logs:/var/log/gitlab
      - ./shared/data/gitlab-data:/var/opt/gitlab
      - ./docs:/shared/docs:ro
    networks:
      - internal
      - host-facing
    healthcheck:
      test: ["CMD-SHELL", "curl -sfL --max-time 5 http://localhost:80 > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # --- GITLAB RUNNER ---
  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: gitlab-runner
    restart: always
    volumes:
      - ./shared/data/runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
    depends_on:
      - gitlab
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[g]itlab-runner' > /dev/null && exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # --- JUPYTERHUB ---
  jupyterhub:
    build:
      context: ./jupyterhub
      dockerfile: Dockerfile
    container_name: jupyterhub
    restart: unless-stopped
    ports:
      - "${JUPYTERHUB_PORT:-8000}:8000"
    env_file:
      - .env.jupyterhub
    environment:
      JUPYTERHUB_PORT: ${JUPYTERHUB_PORT:-8000}
      JH_API_TOKEN: ${JH_API_TOKEN}
      LLM_MENTOR_TYPE: ${LLM_MENTOR_TYPE}
      LLM_MENTOR_BASE_URL: ${LLM_MENTOR_BASE_URL}
      LLM_MENTOR_API_KEY: ${LLM_MENTOR_API_KEY}
      LLM_CI_TYPE: ${LLM_CI_TYPE}
      LLM_CI_BASE_URL: ${LLM_CI_BASE_URL}
      LLM_CI_API_KEY: ${LLM_CI_API_KEY}
      LLM_USE_LOCAL: ${LLM_USE_LOCAL:-false}
    volumes:
      - user-homes:/home
      - shared-data:/shared/data:ro
      - ./shared/data/shared-packages/site-packages:/usr/local/lib/python3.10/shared-packages
      - hf-cache:/hf-cache
      - pip-cache:/shared/pip-cache
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
      - host-facing
    depends_on:
      gitlab:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 3 http://localhost:8000/hub/spawn || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # --- LOCAL LLM (optional, profile: local-llm) ---
  # Устаревший подход: модель загружается в volume. Оставлен для обратной совместимости.
  llm:
    build:
      context: ./llm
      dockerfile: Dockerfile
      args:
        GGUF_PATH: ${GGUF_PATH:-none}
    container_name: llm
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    environment:
      NGPU_LAYERS: "99"
      CONTEXT_SIZE: "65536"
      LLM_HOST: "0.0.0.0"
      LLM_PORT: "8080"
    volumes:
      - llm-models:/models
    expose:
      - "8080"
    networks:
      - internal
    command: ["/app/llama-server", "-m", "/models/model.gguf", "-ngl", "99", "-c", "65536", "--host", "0.0.0.0", "--port", "8080", "--cache-type-k", "q8_0", "--cache-type-v", "q8_0"]
    profiles:
      - local-llm
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/models || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s

  # --- LOCAL LLM GIGACHAT (optional, profile: local-llm-gigachat) ---
  # Модель GigaChat3.1-10B встроена в образ, volume /models не требуется.
  llm-gigachat:
    image: istp-llm-gigachat:latest
    container_name: llm
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    environment:
      NGPU_LAYERS: "99"
      CONTEXT_SIZE: "65536"
      LLM_HOST: "0.0.0.0"
      LLM_PORT: "8080"
    expose:
      - "8080"
    networks:
      - internal
    command: ["/usr/local/bin/start-server.sh"]
    profiles:
      - local-llm-gigachat
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/models || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s

  # --- LOCAL LLM QWEN (optional, profile: local-llm-qwen) ---
  # Модель Qwen2.5-3B встроена в образ, volume /models не требуется.
  llm-qwen:
    image: istp-llm-qwen:latest
    container_name: llm
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    environment:
      NGPU_LAYERS: "99"
      CONTEXT_SIZE: "65536"
      LLM_HOST: "0.0.0.0"
      LLM_PORT: "8080"
    expose:
      - "8080"
    networks:
      - internal
    command: ["/usr/local/bin/start-server.sh"]
    profiles:
      - local-llm-qwen
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/models || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s

  # --- DOCKER REGISTRY ---
  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    ports:
      - "${REGISTRY_PORT:-5050}:5000"
    volumes:
      - ./shared/data/registry:/var/lib/registry
    networks:
      - internal
      - host-facing
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/v2/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --- ADMIN DASHBOARD ---
  admin-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: admin-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-9000}:5000"
    environment:
      FLASK_ENV: production
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      GITLAB_URL: "http://gitlab:80"
      GITLAB_ADMIN_TOKEN: ${GITLAB_ADMIN_TOKEN:-}
    volumes:
      - user-homes:/home
    networks:
      - internal
      - host-facing
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  jupyterhub-data:
  llm-models:
  shared-data:
    external: true
    name: ${PROJECT_VOLUME_PREFIX}_shared-data
  user-homes:
  hf-cache:
    external: true
    name: ${PROJECT_VOLUME_PREFIX}_hf-cache
  pip-cache:
    external: true
    name: ${PROJECT_VOLUME_PREFIX}_pip-cache

networks:
  internal:
    driver: bridge
  host-facing:
    driver: bridge
