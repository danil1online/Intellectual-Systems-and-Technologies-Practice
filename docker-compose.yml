services:
  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    container_name: zitadel
    restart: unless-stopped
    command: start/init/from/master --tlsMode external
    ports:
      - "${ZITADEL_PORT:-9200}:9200"
    volumes:
      - zitadel-data:/var/zitadel
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9200/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    restart: always
    hostname: "gitlab.${HOST_DOMAIN:-localhost}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url '${GITLAB_EXTERNAL_URL:-http://localhost}'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        gitlab_rails['ldap_enabled'] = false
        gitlab_rails['oauth_enabled'] = false
        gitlab_rails['omniauth_enabled'] = false
        gitlab_rails['omniauth_auto_link_user'] = true
        gitlab_rails['omniauth_providers'] = []
        # We configure external OIDC via Zitadel after setup
    ports:
      - "80:80"
      - "2222:22"
    volumes:
      - ./shared/data/gitlab-config:/etc/gitlab
      - ./shared/data/gitlab-logs:/var/log/gitlab
      - ./shared/data/gitlab-data:/var/opt/gitlab
    networks:
      - internal
      - host-facing
    depends_on:
      - zitadel
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: gitlab-runner
    restart: always
    volumes:
      - ./shared/data/runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
    depends_on:
      - gitlab
    healthcheck:
      test: ["CMD", "gl-runner", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  jupyterhub:
    build:
      context: ./jupyterhub
      dockerfile: Dockerfile
    container_name: jupyterhub
    restart: unless-stopped
    ports:
      - "${JUPYTERHUB_PORT:-8000}:8000"
    environment:
      ZITADEL_ISSUER: "http://zitadel:9200"
      ZITADEL_CLIENT_ID: "${JH_ZITADEL_CLIENT_ID}"
      ZITADEL_CLIENT_SECRET: "${JH_ZITADEL_CLIENT_SECRET}"
      ZITADEL_ISSUER_URL: "http://zitadel:9200"
      OAUTH2_REDIRECT_URI: "/hub/oauth_callback"
      JUPYTERHUB_API_TOKEN: "${JH_API_TOKEN}"
      ZITADEL_ADMIN_TOKEN: "${ZITADEL_ADMIN_TOKEN}"
      GGUF_PATH: "${GGUF_PATH:-}"
      LLM_MENTOR_TYPE: "${LLM_MENTOR_TYPE}"
      LLM_MENTOR_BASE_URL: "${LLM_MENTOR_BASE_URL}"
      LLM_MENTOR_API_KEY: "${LLM_MENTOR_API_KEY}"
      LLM_CI_TYPE: "${LLM_CI_TYPE}"
      LLM_CI_BASE_URL: "${LLM_CI_BASE_URL}"
      LLM_CI_API_KEY: "${LLM_CI_API_KEY}"
      LLM_USE_LOCAL: "${LLM_USE_LOCAL:-false}"
    volumes:
      - ./shared/data/logs:/app/logs
      - ./shared/data/shared-data:/home/jovyan/shared/data
      - ./shared/data/shared-logs:/app/logs
    networks:
      - internal
      - host-facing
    depends_on:
      zitadel:
        condition: service_healthy
      gitlab:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/hub/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  nextcloud:
    image: nextcloud:apache
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "${NEXTCLOUD_PORT:-8080}:80"
    environment:
      NEXTCLOUD_ADMIN_USER: "${NC_ADMIN_USER}"
      NEXTCLOUD_ADMIN_PASSWORD: "${NC_ADMIN_PASSWORD}"
      NEXTCLOUD_TRUSTED_PROXIES: "172.16.0.0/12"
      OVERWRITEPROTOCOL: "http"
      ONLYOFFICE_VERIFY_PEER_INNER: "false"
      ONLYOFFICE_VERIFY_PEER_OUTER: "false"
    volumes:
      - nextcloud-data:/var/www/html
      - nextcloud-config:/usr/local/etc/php
      - nextcloud-custom:/var/www/html/custom_apps
      - nextcloud-data-merged:/var/www/html/data
      - ./shared/data/logs:/var/log/nextcloud
      - ./shared/data/shared-logs:/var/log/nextcloud/logs
    networks:
      - internal
      - host-facing
    depends_on:
      zitadel:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    restart: unless-stopped
    environment:
      JWT_SECRET: "${ONLYOFFICE_JWT_SECRET}"
    volumes:
      - onlyoffice-data:/var/lib/onlyoffice
      - onlyoffice-logs:/var/log/onlyoffice
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  llm:
    build:
      context: ./llm
      dockerfile: Dockerfile
      args:
        GGUF_PATH: "${GGUF_PATH:-none}"
    container_name: llm
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    environment:
      GGUF_MODEL_PATH: ${GGUF_PATH:-/models/Qwen3.5-0.8B-Q4_K_M.gguf}
      NGPU_LAYERS: "99"
      CONTEXT_SIZE: "32768"
    volumes:
      - ${GGUF_PATH:-/home/user1/Downloads}:/models:ro
    expose:
      - "8080"
    networks:
      - internal
    command: >
      /bin/sh -c "
        if [ -f /models/$(basename $GGUF_MODEL_PATH) ]; then
          llama-server \
            -m $GGUF_MODEL_PATH \
            -ngl $NGPU_LAYERS \
            -c $CONTEXT_SIZE \
            --host 0.0.0.0 \
            --port 8080
        else
          echo 'Model not found!' && exit 1
        fi
      "
    profiles:
      - local-llm
    depends_on:
      - zitadel
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  admin-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: admin-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-9000}:5000"
    environment:
      ZITADEL_ISSUER: "http://zitadel:9200"
      DASHBOARD_CLIENT_ID: "${DASH_CLIENT_ID}"
      DASHBOARD_CLIENT_SECRET: "${DASH_CLIENT_SECRET}"
      LOG_FILE: "/app/logs/grading_log.json"
      FLASK_ENV: "production"
    volumes:
      - ./shared/data/logs:/app/logs:ro
    networks:
      - internal
      - host-facing
    depends_on:
      zitadel:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  zitadel-data:
  nextcloud-data:
  nextcloud-config:
  nextcloud-custom:
  nextcloud-data-merged:
  onlyoffice-data:
  onlyoffice-logs:

networks:
  internal:
    driver: bridge
  host-facing:
    driver: bridge
