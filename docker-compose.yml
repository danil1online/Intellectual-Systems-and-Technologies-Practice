services:
  # --- KEYCLOAK (Production-ready) ---
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://kc-postgres:5432/keycloak
      KC_DB_USERNAME: kcadmin
      KC_DB_PASSWORD: kcpassword
      KC_HTTP_RELATIVE_PATH: /auth
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: ${GITLAB_HOST:-localhost}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_PORT: ${KEYCLOAK_PORT:-9200}
    ports:
      - "${KEYCLOAK_PORT:-9200}:9200"
    command: start --http-enabled=true
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./shared/data/oidc:/shared/oidc
    networks:
      - internal
      - host-facing
    depends_on:
      kc-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9200 && exec 3>&-"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  kc-postgres:
    image: postgres:17-alpine
    container_name: kc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kcadmin
      POSTGRES_PASSWORD: kcpassword
      POSTGRES_DB: keycloak
    volumes:
      - kc-postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d keycloak -U kcadmin"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 40s

  # --- KEYCLOAK INITIALIZER (idempotent, runs from script) ---
  keycloak-init:
    build:
      context: ./keycloak-init
      dockerfile: Dockerfile
    container_name: keycloak_init
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./shared/data/oidc:/shared/oidc
    networks:
      - internal
    environment:
      GITLAB_HOST: ${GITLAB_HOST}
      HOST_IP_LOCAL: ${HOST_IP_LOCAL:-localhost}
      JUPYTERHUB_PORT: ${JUPYTERHUB_PORT:-8000}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-9000}
      NEXTCLOUD_PORT: ${NEXTCLOUD_PORT:-8080}
      KEYCLOAK_PORT: ${KEYCLOAK_PORT:-9200}
      GITLAB_EXTERNAL_URL: ${GITLAB_EXTERNAL_URL}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_LECTURER_01_PASSWORD: ${LECTURER_01_PASSWORD}
      KC_LECTURER_02_PASSWORD: ${LECTURER_02_PASSWORD}
      OIDC_GITLAB_SECRET: ${OIDC_GITLAB_SECRET}
      OIDC_JUPYTER_SECRET: ${OIDC_JUPYTER_SECRET}
      OIDC_NEXTCLOUD_SECRET: ${OIDC_NEXTCLOUD_SECRET}
      OIDC_DASHBOARD_SECRET: ${OIDC_DASHBOARD_SECRET}
      OIDC_REGISTRY_SECRET: ${OIDC_REGISTRY_SECRET}
    entrypoint: ["/bin/sh", "/app/init.sh"]

  # --- GITLAB CE ---
  gitlab:
    build:
      context: ./gitlab-custom
      dockerfile: Dockerfile
    container_name: gitlab
    restart: always
    hostname: "gitlab.${HOST_DOMAIN:-localhost}"
    shm_size: "256m"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD}
      OIDC_GITLAB_SECRET: ${OIDC_GITLAB_SECRET}
      OIDC_HOST_IP: ${GITLAB_HOST}
      KEYCLOAK_PORT: ${KEYCLOAK_PORT:-9200}
    ports:
      - "80:80"
      - "2222:22"
    volumes:
      - ./shared/data/gitlab-config:/etc/gitlab
      - ./shared/data/gitlab-logs:/var/log/gitlab
      - ./shared/data/gitlab-data:/var/opt/gitlab
    networks:
      - internal
      - host-facing
    depends_on:
      - keycloak
    healthcheck:
      test: ["CMD-SHELL", "curl -sfL --max-time 5 http://localhost:80 > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # --- GITLAB RUNNER ---
  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: gitlab-runner
    restart: always
    volumes:
      - ./shared/data/runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
    depends_on:
      - gitlab
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[g]itlab-runner' > /dev/null && exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # --- JUPYTERHUB ---
  jupyterhub:
    build:
      context: ./jupyterhub
      dockerfile: Dockerfile
    container_name: jupyterhub
    restart: unless-stopped
    ports:
      - "${JUPYTERHUB_PORT:-8000}:8000"
    env_file:
      - .env.jupyterhub
    environment:
      HOST_IP: ${GITLAB_HOST}
      HOST_IP_LOCAL: ${HOST_IP_LOCAL:-localhost}
      JUPYTERHUB_PORT: ${JUPYTERHUB_PORT:-8000}
      KEYCLOAK_PORT: ${KEYCLOAK_PORT:-9200}
      JH_KEYCLOAK_CLIENT_ID: "jupyterhub"
      JH_KEYCLOAK_CLIENT_SECRET: ${OIDC_JUPYTER_SECRET}
      JH_KEYCLOAK_ISSUER: "http://${GITLAB_HOST}:${KEYCLOAK_PORT}/auth/realms/istp"
      JH_KEYCLOAK_TOKEN_URL: "http://keycloak:9200/auth/realms/istp/protocol/openid-connect/token"
      JH_KEYCLOAK_USERDATA_URL: "http://keycloak:9200/auth/realms/istp/protocol/openid-connect/userinfo"
      JH_API_TOKEN: ${JH_API_TOKEN}
      JUPYTERHUB_COOKIE_SECRET: "4c4b683d0129c5ab67c276b56c1b6174291529f2bd0313b300e8adef5f4c4b79"
      COOKIE_SAMESITE: "None"
      COOKIE_SECURE: "false"
      GGUF_PATH: ${GGUF_PATH:-}
      LLM_MENTOR_TYPE: ${LLM_MENTOR_TYPE}
      LLM_MENTOR_BASE_URL: ${LLM_MENTOR_BASE_URL}
      LLM_MENTOR_API_KEY: ${LLM_MENTOR_API_KEY}
      LLM_CI_TYPE: ${LLM_CI_TYPE}
      LLM_CI_BASE_URL: ${LLM_CI_BASE_URL}
      LLM_CI_API_KEY: ${LLM_CI_API_KEY}
      LLM_USE_LOCAL: ${LLM_USE_LOCAL:-false}
    volumes:
      - ./shared/data/logs:/app/logs
      - ./shared/data/docs:/app/docs:ro
      - ./shared/data/shared-data:/shared/data:ro
      - ./shared/data/cache_huggingface:/shared/data/cache_huggingface:rw
      - ./shared/data/shared-packages/site-packages:/usr/local/lib/python3.10/shared-packages:ro
      - ./shared/data/shared-pip-cache:/shared/pip-cache
    networks:
      - internal
      - host-facing
    depends_on:
      keycloak:
        condition: service_healthy
      gitlab:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 3 http://localhost:8000/hub/spawn || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # --- NEXTCLOUD ---
  nextcloud:
    image: nextcloud:apache
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "${NEXTCLOUD_PORT:-8080}:80"
    environment:
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_PROXIES: "172.16.0.0/12"
      OVERWRITEPROTOCOL: "http"
      ONLYOFFICE_VERIFY_PEER_INNER: "false"
      ONLYOFFICE_VERIFY_PEER_OUTER: "false"
      HOST_IP: ${GITLAB_HOST}
      LOCAL_IP: ${LOCAL_IP:-localhost}
      KEYCLOAK_PORT: ${KEYCLOAK_PORT}
      NEXTCLOUD_PORT: ${NEXTCLOUD_PORT:-8080}
      ONLYOFFICE_PORT: ${ONLYOFFICE_PORT:-9300}
      OIDC_NEXTCLOUD_SECRET: ${OIDC_NEXTCLOUD_SECRET}
      SQLITE_DATABASE: nextcloud
    volumes:
      - nextcloud-data:/var/www/html
      - nextcloud-config:/usr/local/etc/php
      - nextcloud-custom:/var/www/html/custom_apps
      - nextcloud-data-merged:/var/www/html/data
      - ./shared/data/logs:/var/log/nextcloud
      - ./nextcloud/docker-entrypoint-hooks.d/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
      - ./shared/data/oidc:/shared/oidc:ro
    networks:
      - internal
      - host-facing
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php /var/www/html/occ status 2>/dev/null | grep -q installed || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # --- LOCAL LLM (optional, profile: local-llm) ---
  llm:
    build:
      context: ./llm
      dockerfile: Dockerfile
      args:
        GGUF_PATH: ${GGUF_PATH:-none}
    container_name: llm
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    environment:
      LLM_MODEL_NAME: "Qwen3.5-0.8B-Q4_K_M.gguf"
      NGPU_LAYERS: "99"
      CONTEXT_SIZE: "65536"
      LLM_HOST: "0.0.0.0"
      LLM_PORT: "8080"
    volumes:
      - llm-models:/models
    expose:
      - "8080"
    networks:
      - internal
    command: ["/app/llama-server", "-m", "/models/Qwen3.5-0.8B-Q4_K_M.gguf", "-ngl", "99", "-c", "65536", "--host", "0.0.0.0", "--port", "8080", "--cache-type-k", "q8_0", "--cache-type-v", "q8_0"]
    profiles:
      - local-llm
    depends_on:
      - keycloak
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/models')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s

  # --- DOCKER REGISTRY ---
  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    ports:
      - "${REGISTRY_PORT:-5050}:5000"
    volumes:
      - ./shared/data/registry:/var/lib/registry
    networks:
      - internal
      - host-facing
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/v2/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --- ADMIN DASHBOARD ---
  admin-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: admin-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-9000}:5000"
    environment:
      KEYCLOAK_ISSUER: "http://keycloak:9200/auth/realms/istp"
      DASHBOARD_CLIENT_ID: ${DASH_CLIENT_ID}
      DASHBOARD_CLIENT_SECRET: ${DASH_CLIENT_SECRET}
      LOG_FILE: /app/logs/grading_log.json
      FLASK_ENV: production
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
    volumes:
      - ./shared/data/logs:/app/logs:ro
    networks:
      - internal
      - host-facing
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  keycloak-data:
  kc-postgres-data:
  jupyterhub-data:
  nextcloud-data:
  nextcloud-config:
  nextcloud-custom:
  nextcloud-data-merged:
  llm-models:

networks:
  internal:
    driver: bridge
  host-facing:
    driver: bridge
