services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    restart: unless-stopped
    command: start-dev --http-enabled=true
    ports:
      - "${KEYCLOAK_PORT:-9200}:8080"
    environment:
      KEYCLOAK_ADMIN: "${KC_ADMIN_USER:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "${KC_ADMIN_PASSWORD}"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://kc-postgres:5432/keycloak
      KC_DB_USERNAME: kcadmin
      KC_DB_PASSWORD: kcpassword
      KC_HTTP_RELATIVE_PATH: /auth
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks:
      - internal
      - host-facing
    depends_on:
      kc-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && exec 3>&-"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  kc-postgres:
    image: postgres:17-alpine
    container_name: kc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kcadmin
      POSTGRES_PASSWORD: kcpassword
      POSTGRES_DB: keycloak
    volumes:
      - kc-postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d keycloak -U kcadmin"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 40s

  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    restart: always
    hostname: "gitlab.${HOST_DOMAIN:-localhost}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GITLAB_KEYCLOAK_CLIENT_ID: "${GITLAB_KEYCLOAK_CLIENT_ID:-gitlab}"
      GITLAB_KEYCLOAK_CLIENT_SECRET: "${GITLAB_KEYCLOAK_CLIENT_SECRET}"
      GITLAB_OMNIBUS_CONFIG: |
        external_url '${GITLAB_EXTERNAL_URL:-http://localhost}'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        puma['worker_processes'] = 4
        puma['max_threads'] = 8
        gitlab_rails['ldap_enabled'] = false
    ports:
      - "80:80"
      - "2222:22"
    volumes:
      - ./shared/data/gitlab-config:/etc/gitlab
      - ./shared/data/gitlab-logs:/var/log/gitlab
      - ./shared/data/gitlab-data:/var/opt/gitlab
    networks:
      - internal
      - host-facing
    depends_on:
      - keycloak
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: gitlab-runner
    restart: always
    volumes:
      - ./shared/data/runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
    depends_on:
      - gitlab
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[g]itlab-runner' > /dev/null && exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  jupyterhub:
    build:
      context: ./jupyterhub
      dockerfile: Dockerfile
    container_name: jupyterhub
    restart: unless-stopped
    ports:
      - "${JUPYTERHUB_PORT:-8000}:8000"
    environment:
      KEYCLOAK_ISSUER: "http://keycloak:8080/auth/realms/istp"
      JH_KEYCLOAK_CLIENT_ID: "${JH_KEYCLOAK_CLIENT_ID}"
      JH_KEYCLOAK_CLIENT_SECRET: "${JH_KEYCLOAK_CLIENT_SECRET}"
      OAUTH2_REDIRECT_URI: "/hub/oauth_callback"
      JUPYTERHUB_API_TOKEN: "${JH_API_TOKEN}"
      GGUF_PATH: "${GGUF_PATH:-}"
      LLM_MENTOR_TYPE: "${LLM_MENTOR_TYPE}"
      LLM_MENTOR_BASE_URL: "${LLM_MENTOR_BASE_URL}"
      LLM_MENTOR_API_KEY: "${LLM_MENTOR_API_KEY}"
      LLM_CI_TYPE: "${LLM_CI_TYPE}"
      LLM_CI_BASE_URL: "${LLM_CI_BASE_URL}"
      LLM_CI_API_KEY: "${LLM_CI_API_KEY}"
      LLM_USE_LOCAL: "${LLM_USE_LOCAL:-false}"
    volumes:
      - ./shared/data/logs:/app/logs
      - ./shared/data/docs:/app/docs:ro
      - ./shared/data/shared-data:/shared/data:ro
      - ./shared/data/cache_huggingface:/shared/data/cache_huggingface:rw
      - ./shared/data/shared-logs:/app/logs
    networks:
      - internal
      - host-facing
    depends_on:
      keycloak:
        condition: service_healthy
      gitlab:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/hub/login')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  nextcloud:
    image: nextcloud:apache
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "${NEXTCLOUD_PORT:-8080}:80"
    environment:
      NEXTCLOUD_ADMIN_USER: "${NC_ADMIN_USER}"
      NEXTCLOUD_ADMIN_PASSWORD: "${NC_ADMIN_PASSWORD}"
      NEXTCLOUD_TRUSTED_PROXIES: "172.16.0.0/12"
      OVERWRITEPROTOCOL: "http"
      ONLYOFFICE_VERIFY_PEER_INNER: "false"
      ONLYOFFICE_VERIFY_PEER_OUTER: "false"
      OIDC_LOGIN_AUTHORIZE_ENDPOINT: "http://keycloak:8080/auth/realms/istp/protocol/openid-connect/auth"
      OIDC_LOGIN_JWKS_URI: "http://keycloak:8080/auth/realms/istp/protocol/openid-connect/certs"
      OIDC_LOGIN_LOGOUT_ENDPOINT: "http://keycloak:8080/auth/realms/istp/protocol/openid-connect/logout"
      OIDC_LOGIN_USER_ENDPOINT: "http://keycloak:8080/auth/realms/istp/protocol/openid-connect/userinfo"
      OIDC_LOGIN_CLIENT_ID: "${NC_KEYCLOAK_CLIENT_ID}"
      OIDC_LOGIN_CLIENT_SECRET: "${NC_KEYCLOAK_CLIENT_SECRET}"
      OIDC_LOGIN_ID_TOKEN_HINT: ""
    volumes:
      - nextcloud-data:/var/www/html
      - nextcloud-config:/usr/local/etc/php
      - nextcloud-custom:/var/www/html/custom_apps
      - nextcloud-data-merged:/var/www/html/data
      - ./shared/data/logs:/var/log/nextcloud
      - ./shared/data/shared-logs:/var/log/nextcloud/logs
    networks:
      - internal
      - host-facing
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php /var/www/html/occ status 2>/dev/null | grep -q installed || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    restart: unless-stopped
    environment:
      JWT_SECRET: "${ONLYOFFICE_JWT_SECRET}"
    volumes:
      - onlyoffice-data:/var/lib/onlyoffice
      - onlyoffice-logs:/var/log/onlyoffice
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null -w '%{http_code}' http://localhost:80/ | grep -E '^(200|302|301)$'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  llm:
    build:
      context: ./llm
      dockerfile: Dockerfile
      args:
        GGUF_PATH: "${GGUF_PATH:-none}"
    container_name: llm
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    environment:
      LLM_MODEL_NAME: "Qwen3.5-0.8B-Q4_K_M.gguf"
      NGPU_LAYERS: "99"
      CONTEXT_SIZE: "65536"
      LLM_HOST: "0.0.0.0"
      LLM_PORT: "8080"
    volumes:
      - llm-models:/models
    expose:
      - "8080"
    networks:
      - internal
    command: ["/app/llama-server", "-m", "/models/Qwen3.5-0.8B-Q4_K_M.gguf", "-ngl", "99", "-c", "65536", "--host", "0.0.0.0", "--port", "8080", "--cache-type-k", "q8_0", "--cache-type-v", "q8_0"]
    profiles:
      - local-llm
    depends_on:
      - keycloak
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/models')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    ports:
      - "${REGISTRY_PORT:-5050}:5000"
    volumes:
      - ./shared/data/registry:/var/lib/registry
    networks:
      - internal
      - host-facing
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/v2/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  admin-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: admin-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-9000}:5000"
    environment:
      KEYCLOAK_ISSUER: "http://keycloak:8080/auth/realms/istp"
      DASHBOARD_CLIENT_ID: "${DASH_CLIENT_ID}"
      DASHBOARD_CLIENT_SECRET: "${DASH_CLIENT_SECRET}"
      LOG_FILE: "/app/logs/grading_log.json"
      FLASK_ENV: "production"
    volumes:
      - ./shared/data/logs:/app/logs:ro
    networks:
      - internal
      - host-facing
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  keycloak-data:
  kc-postgres-data:
  nextcloud-data:
  nextcloud-config:
  nextcloud-custom:
  nextcloud-data-merged:
  onlyoffice-data:
  onlyoffice-logs:
  llm-models:

networks:
  internal:
    driver: bridge
  host-facing:
    driver: bridge
